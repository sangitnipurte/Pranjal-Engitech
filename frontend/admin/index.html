<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin CMS | Pranjal Engitech</title><link rel="stylesheet" href="../style.css"><style>body{background:#eef2f7}.admin-layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#071f3e;color:#d9e6f5;padding:22px 14px;position:sticky;top:0;height:100vh}.side-brand{display:flex;gap:10px;align-items:center;padding:8px 10px 25px;border-bottom:1px solid #244365}.side-brand img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:8px}.side-brand strong{display:block;color:#fff;font-size:13px}.side-brand small{font-size:9px;color:#ff9a65}.side button{width:100%;text-align:left;background:transparent;color:#d9e6f5;border:0;border-radius:8px;padding:12px 13px;margin:3px 0;font-weight:600;cursor:pointer}.side button:hover,.side button.active{background:#123b69;color:#fff}.main{padding:28px 32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;color:#09284f;font-size:29px}.admin-panel{background:#fff;border:1px solid #dfe6ef;border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 8px 30px rgba(9,40,79,.055)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.stat{background:#fff;border:1px solid #e1e7ef;border-radius:12px;padding:18px}.stat span{font-size:12px;color:#667085;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.stat b{display:block;font-size:29px;color:#09284f;margin-top:4px}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:12px;border-bottom:1px solid #e9edf2;text-align:left;vertical-align:middle}.admin-table th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#667085;background:#f8fafc}.thumb{width:70px;height:54px;object-fit:contain;background:#f5f7f9;border-radius:6px;border:1px solid #e4e9f0}.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.admin-form .full{grid-column:1/-1}.admin-form label{font-size:12px;font-weight:700;color:#344054;display:block;margin-bottom:7px}.admin-form input,.admin-form textarea,.admin-form select{width:100%;padding:12px;border:1px solid #d5dce5;border-radius:7px;font:inherit;background:#fff}.admin-form textarea{min-height:105px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.btn-small{padding:8px 11px;border-radius:6px;border:1px solid #ccd5e0;background:#fff;cursor:pointer;font-weight:700}.btn-danger{background:#b42318;color:#fff;border-color:#b42318}.btn-success{background:#087443;color:#fff;border-color:#087443}.section-note{font-size:13px;color:#667085;margin:-7px 0 16px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(460px,100%);background:#fff;border-radius:16px;padding:34px;box-shadow:0 20px 60px rgba(9,40,79,.12)}.login-card img{display:block;width:100px;height:70px;object-fit:contain;margin:auto}.note{font-size:12px;color:#667085}.toast{position:fixed;right:20px;bottom:20px;background:#09284f;color:#fff;padding:13px 17px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:99}.hidden{display:none!important}.danger-note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px 14px;border-radius:8px;margin-bottom:15px}@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.admin-layout{grid-template-columns:1fr}.side{position:relative;height:auto}.side nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.stats{grid-template-columns:repeat(2,1fr)}.admin-form{grid-template-columns:1fr}.main{padding:18px}.admin-table{display:block;overflow:auto;white-space:nowrap}}@media(max-width:520px){.side nav{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}</style></head><body><div id="login" class="login"><div class="login-card"><img src="../assets/logo.png" alt="Pranjal Engitech"><h2 style="text-align:center;color:#09284f">Admin Portal</h2><p class="note" style="text-align:center">Direct access only · not linked from the public website</p><form id="loginForm" class="form"><label>Username</label><input id="username" required><label>Password</label><input id="password" type="password" required><button class="btn btn-primary">Login</button><div id="loginError" class="notice error hidden"></div></form></div></div><div id="app" class="admin-layout hidden"><aside class="side"><div class="side-brand"><img id="sideLogo" src="../assets/logo.png" alt=""><div><strong>PRANJAL ENGITECH</strong><small>ADMIN CMS</small></div></div><nav style="margin-top:18px"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="settings">Website Settings</button><button data-tab="categories">Header Categories</button><button data-tab="products">Products</button><button data-tab="clients">Our Clients</button><button data-tab="events">Events &amp; Exhibitions</button><button data-tab="enquiries">Enquiries</button><button id="logout">Logout</button></nav></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="note">Manage public website content. The admin portal is never linked from the public navigation.</div></div><a class="btn btn-outline" href="../" target="_blank">View Website</a></div><div id="content"></div></main></div><div id="toast" class="toast hidden"></div><script src="../config.js"></script><script src="admin.js"></script></body></html>
