{% extends 'admin/base.html' %}{% block content %}<div class="section-head"><div><div class="eyebrow">Catalogue</div><h2>Categories</h2><p>Create, edit, hide or delete product categories.</p></div></div><div class="admin-card"><form method="post" enctype="multipart/form-data"><input type="hidden" name="id"><div class="two-col"><div><label>Category Name</label><input name="name" required></div><div><label>Sort Order</label><input name="sort_order" type="number" value="0"></div></div><label>Description</label><textarea name="description"></textarea><label>Cover Image</label><input type="file" name="image" accept="image/*"><label><input type="checkbox" name="active" checked> Active</label><button class="btn btn-primary" style="margin-top:15px">Save Category</button></form></div><div class="admin-card"><table class="admin-table"><tr><th>Name</th><th>Description</th><th>Status</th><th>Action</th></tr>{% for c in categories %}<tr><td>{{ c.name }}</td><td>{{ c.description }}</td><td>{{ 'Active' if c.active else 'Hidden' }}</td><td><button class="btn btn-outline" onclick='editCategory({{ c|tojson }})'>Edit</button> <form style="display:inline" method="post" action="{{ url_for('admin_category_delete',ident=c.id) }}"><button class="btn btn-primary" data-confirm="Delete category?">Delete</button></form></td></tr>{% endfor %}</table><script>function editCategory(c){document.querySelector('input[name=id]').value=c.id;document.querySelector('input[name=name]').value=c.name||'';document.querySelector('input[name=sort_order]').value=c.sort_order||0;document.querySelector('textarea[name=description]').value=c.description||'';document.querySelector('input[name=active]').checked=!!c.active;window.scrollTo({top:0,behavior:'smooth'})}</script></div>{% endblock %}
