<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="admin-shell"><div style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="admin-card" style="width:min(440px,100%)"><img src="{{ image_url(site.logo_image) }}" style="width:130px;height:90px;object-fit:contain;display:block;margin:auto"><h1 style="text-align:center;color:var(--navy)">Admin Login</h1><p class="small" style="text-align:center">Manage website content, products, images and enquiries.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form class="form" method="post"><label>Username</label><input name="username" value="admin" required><label>Password</label><input name="password" type="password" required><button class="btn btn-primary" type="submit">Login</button></form><p class="modal-note">Change ADMIN_USERNAME and ADMIN_PASSWORD in .env before deployment.</p></div></div></body></html>
