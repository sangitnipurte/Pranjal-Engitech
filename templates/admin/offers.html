{% extends 'admin/base.html' %}{% block content %}<div class="section-head"><div><div class="eyebrow">Marketing CMS</div><h2>Offers / Announcement Popups</h2><p>Create an offer and keep it ready for your next homepage popup.</p></div></div><div class="admin-card"><form method="post" enctype="multipart/form-data"><input type="hidden" name="id"><div class="two-col"><div><label>Offer Title</label><input name="title" required></div><div><label>Button Text</label><input name="button_text" value="Get Quote"></div><div><label>Button URL</label><input name="button_url" value="/contact"></div><div><label>Offer Image</label><input type="file" name="image" accept="image/*"></div></div><label>Offer Text</label><textarea name="text"></textarea><label><input type="checkbox" name="active"> Active</label><button class="btn btn-primary" style="margin-top:15px">Save Offer</button></form></div><div class="admin-card"><table class="admin-table"><tr><th>Title</th><th>Text</th><th>Status</th><th>Action</th></tr>{% for o in offers %}<tr><td>{{ o.title }}</td><td>{{ o.text }}</td><td>{{ 'Active' if o.active else 'Inactive' }}</td><td><button class="btn btn-outline" onclick='editOffer({{ o|tojson }})'>Edit</button> <form style="display:inline" method="post" action="{{ url_for('admin_offer_delete',ident=o.id) }}"><button class="btn btn-primary" data-confirm="Delete offer?">Delete</button></form></td></tr>{% endfor %}</table><script>function editOffer(o){document.querySelector('input[name=id]').value=o.id;document.querySelector('input[name=title]').value=o.title||'';document.querySelector('textarea[name=text]').value=o.text||'';document.querySelector('input[name=button_text]').value=o.button_text||'';document.querySelector('input[name=button_url]').value=o.button_url||'';document.querySelector('input[name=active]').checked=!!o.active;window.scrollTo({top:0,behavior:'smooth'})}</script></div>{% endblock %}
