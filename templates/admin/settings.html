{% extends 'admin/base.html' %}{% block content %}<div class="section-head"><div><div class="eyebrow">Website</div><h2>Website Settings</h2><p>Edit company information, branding, hero content, contact details and social links.</p></div></div><form class="admin-card" method="post" enctype="multipart/form-data"><div class="two-col"><div><label>Company Name</label><input name="company_name" value="{{ s.company_name }}"></div><div><label>Short Name</label><input name="short_name" value="{{ s.short_name }}"></div><div><label>Tagline</label><input name="tagline" value="{{ s.tagline }}"></div><div><label>Phone</label><input name="phone" value="{{ s.phone }}"></div><div><label>Email</label><input name="email" value="{{ s.email }}"></div><div><label>Business Hours</label><input name="hours" value="{{ s.hours }}"></div></div><label>Address</label><textarea name="address">{{ s.address }}</textarea><label>Announcement Bar</label><input name="announcement" value="{{ s.announcement }}"><label>Hero Title</label><input name="hero_title" value="{{ s.hero_title }}"><label>Hero Text</label><textarea name="hero_text">{{ s.hero_text }}</textarea><label>About Title</label><input name="about_title" value="{{ s.about_title }}"><label>About Text</label><textarea name="about_text">{{ s.about_text }}</textarea><div class="two-col"><div><label>Google Maps URL</label><input name="maps_url" value="{{ s.maps_url }}"></div><div><label>WhatsApp</label><input name="whatsapp" value="{{ s.whatsapp }}"></div><div><label>Facebook</label><input name="facebook" value="{{ s.facebook }}"></div><div><label>Instagram</label><input name="instagram" value="{{ s.instagram }}"></div><div><label>LinkedIn</label><input name="linkedin" value="{{ s.linkedin }}"></div><div><label>Footer Text</label><input name="footer_text" value="{{ s.footer_text }}"></div></div><hr><div class="two-col"><div><label>Change Logo</label><input type="file" name="logo_image" accept="image/*"><p class="modal-note">Current: {{ s.logo_image }}</p></div><div><label>Change Hero Image</label><input type="file" name="hero_image" accept="image/*"><p class="modal-note">Current: {{ s.hero_image or 'Default placeholder' }}</p></div></div><div style="margin-top:20px;display:flex;gap:10px"><button class="btn btn-primary" type="submit">Save Changes</button><a class="btn btn-outline" href="{{ url_for('admin_dashboard') }}">Discard / Cancel</a></div></form>{% endblock %}
