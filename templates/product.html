{% extends 'base.html' %}{% block title %}{{ product.name }} | {{ site.company_name }}{% endblock %}{% block content %}<section class="section"><div class="container"><div class="about-grid"><div class="product-img" style="height:500px;border-radius:15px"><img src="{{ image_url(product.image) }}" alt="{{ product.name }}"></div><div><div class="eyebrow">{{ product.category }}</div><h1 style="font-size:42px;color:var(--navy);line-height:1.15">{{ product.name }}</h1><p>{{ product.description }}</p><h3>Specifications / Notes</h3><p style="white-space:pre-line">{{ product.specs }}</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:25px"><a class="btn btn-primary" href="{{ url_for('contact') }}?product={{ product.name|urlencode }}">Request Quote</a><a class="btn btn-outline" href="{{ url_for('products') }}">Back to Products</a></div></div></div></div></section>{% endblock %}
